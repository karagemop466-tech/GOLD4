name: Deploy GOLD research site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Gate 1 — Canonical dataset integrity & derived math recompute (audit.py)
        run: python3 scripts/audit.py
      - name: Gate 2 — Root, /pages & /docs link & policy gate (check_site.py)
        run: python3 scripts/check_site.py
      - name: Gate 3 — Combined schema & blank-flag check (verify.py)
        run: python3 scripts/verify.py
      - name: Gate 4 — Multi-pass 30-page XSS, 404 blocklist & Assay Lab scanner (verify_a0be79d4.py)
        run: python3 scripts/verify_a0be79d4.py
      - name: Gate 5 — Gemstone-deduction, category subpage & 750-check hallucination auditor (audit_hallucinations.py)
        run: python3 scripts/audit_hallucinations.py
      - name: Gate 6a — Citation-integrity self-test (must reject a known-bad CFR citation)
        run: python3 scripts/session_46691f83/verify_citations.py --self-test
      - name: Gate 6b — Citation-integrity check (every CFR citation vs its official section heading)
        run: python3 scripts/session_46691f83/verify_citations.py
      - name: Gate 7 — Live-evidence freshness & source-health gate (audit_freshness.py)
        run: python3 scripts/audit_freshness.py
      - name: Gate 8 — Conservative currency parsing and blank current-price register
        run: python3 scripts/test_assurance.py
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
