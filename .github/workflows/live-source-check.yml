name: Live source health check (read-only collection, isolated evidence return)

# The network collection job is read-only and never writes product values. On a
# same-repository pull request, a separate job downloads only its evidence
# artifact and commits reports/live_source_check_*.json so reviewers in network-
# restricted environments can inspect the raw observations. That second job is
# the only job with contents:write. Branch metadata is passed through environment
# variables and validated as a ref; it is never interpolated into shell code.
#
# A raw-evidence-only commit can intentionally make Gate 7 fail until a reviewer
# reconciles data/source_health.json and the canonical rows. The workflow never
# performs that reconciliation or overwrites a price, weight, URL or policy.

on:
  pull_request:
    branches: [main]
    paths:
      - "data/rings.json"
      - "data/sources.json"
      - "scripts/live_source_check.py"
      - ".github/workflows/live-source-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-source-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Re-open every official source URL (read-only GET)
        env:
          GOLD4_EVIDENCE_SESSION: ${{ github.head_ref || github.ref_name }}
          GOLD4_EVIDENCE_PASS: Pull request live check
        run: python3 scripts/live_source_check.py --timeout 30
        continue-on-error: true
      - name: Publish evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-source-check
          path: reports/live_source_check_*.json
          retention-days: 30
          if-no-files-found: warn

  publish-evidence:
    # Fork PR tokens cannot and must not write to the base repository. Their
    # evidence remains available as an artifact only.
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && always() }}
    needs: live-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Download read-only collection evidence
        uses: actions/download-artifact@v4
        with:
          name: live-source-check
          path: reports
      - name: Commit only raw evidence to the validated PR branch
        env:
          PR_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git check-ref-format --branch "$PR_BRANCH" >/dev/null
          git config user.name "gold4-live-check"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          shopt -s nullglob
          artifacts=(reports/live_source_check_*.json)
          if ((${#artifacts[@]} == 0)); then
            echo "no evidence artifact to commit"
            exit 0
          fi
          git add -- "${artifacts[@]}"
          if git diff --cached --quiet; then
            echo "no evidence change to commit"
            exit 0
          fi
          git commit -m "ci: live source-health evidence $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin "HEAD:refs/heads/$PR_BRANCH"
