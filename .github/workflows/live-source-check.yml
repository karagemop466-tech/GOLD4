name: Live source health check (read-only, evidence only)

# This workflow does NOT gate the site. It re-opens every official URL in the
# dataset from a runner that has unrestricted outbound internet, and uploads the
# raw evidence (HTTP status, soft-404 detection, page title, price snippets)
# as an Actions artifact.
#
# Pass 21 (2026-11-11, session arena/4fe4a9c3-gold4): the artifact host
# (results-receiver / blob storage) is not reachable from the agent sandboxes, so
# two earlier sweeps were uploaded but never read. To make the evidence readable,
# the run MAY commit the raw evidence file back to the pull-request branch — but
# only when ALL of these hold:
#   * the PR comes from this repository (never a fork),
#   * the PR head commit subject contains the opt-in marker [commit-evidence],
#   * the only paths staged are reports/live_source_check_*.json.
# Without the marker it behaves exactly as before: artifact only, no write.
#
# The offline gates in pages.yml cannot see link rot; this one can. It is the
# online half of the anti-hallucination posture: a stored price is only as good
# as the page that still has to print it.
#
# It never writes a value into data/*.json — a human or a later pass reviews the
# artifact and applies findings with provenance.

on:
  pull_request:
    branches: [main]
    paths:
      - "data/rings.json"
      - "data/sources.json"
      - "scripts/live_source_check.py"
      - ".github/workflows/live-source-check.yml"
  workflow_dispatch:

permissions:
  contents: write   # used only by the opt-in evidence commit step below

concurrency:
  group: live-source-check-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - name: Decide whether this run may commit evidence (opt-in marker on the head commit)
        id: optin
        run: |
          subject="$(git log -1 --format=%s)"
          echo "head commit: $subject"
          case "$subject" in
            *"[commit-evidence]"*) echo "commit=yes" >> "$GITHUB_OUTPUT" ;;
            *) echo "commit=no" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Re-open every official source URL (read-only GET)
        run: python3 scripts/live_source_check.py --timeout 30
        continue-on-error: true
      - name: Publish evidence artifact (belt and braces)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-source-check
          path: reports/live_source_check_*.json
          retention-days: 30
          if-no-files-found: warn
      - name: Commit raw evidence back to the PR branch (opt-in, same-repo PRs only, reports/ only)
        if: >-
          always() && steps.optin.outputs.commit == 'yes' &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/live_source_check_*.json
          if git diff --cached --quiet; then echo "no evidence file to commit"; exit 0; fi
          git commit -m "evidence: runner live source check (raw, unreconciled) for ${HEAD_REF}"
          git pull --rebase origin "$HEAD_REF"
          git push origin "HEAD:${HEAD_REF}"
